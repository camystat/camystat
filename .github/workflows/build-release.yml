name: Build and Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup and build
        run: |
          chmod +x setup.bash build.bash
          ./setup.bash
          ./build.bash

      - name: Package build/camystat (exclude CMakeFiles)
        run: |
          rm -rf build/camystat/CMakeFiles

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: camystat-linux-x64
          path: build/camystat

  build-macos:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup and build
        run: |
          chmod +x setup.bash build.bash
          ./setup.bash
          ./build.bash

      - name: Package Camystat.app
        run: |
          test -d build/camystat/Camystat.app
          ditto -c -k --keepParent build/camystat/Camystat.app camystat-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: camystat-macos-x64
          path: camystat-macos.zip

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run setup.ps1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File setup.ps1

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: |
          msbuild camystat.sln /p:Configuration=Release /p:Platform=x64 /property:MultiProcessorCompilation=true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: camystat-windows-x64
          path: x64/Release/

  release:
    name: Create release and publish artifacts
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p release-assets
          (cd artifacts/camystat-linux-x64 && zip -r ../../release-assets/camystat-linux-x64.zip .)
          cp artifacts/camystat-macos-x64/camystat-macos.zip release-assets/camystat-macos-x64.zip
          (cd artifacts/camystat-windows-x64 && zip -r ../../release-assets/camystat-windows-x64.zip .)
          ls -la release-assets/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Build ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}